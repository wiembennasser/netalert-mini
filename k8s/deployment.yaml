apiVersion: apps/v1
kind: Deployment
metadata:
  name: netalert
  labels:
    app: netalert
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netalert
  template:
    metadata:
      labels:
        app: netalert
    spec:
      containers:
        - name: netalert
          image: netalert-mini-netalert:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: netalert
spec:
  type: NodePort
  selector:
    app: netalert
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30080
